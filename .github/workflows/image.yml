name: Image
on:
  push:
    tags: ['v*']

permissions: {}

env:
  IMAGE: ghcr.io/zyvorai/zyvor-setura-gateway
  CHARTS: oci://ghcr.io/zyvorai/charts

jobs:
  image:
    name: Multi-arch image, signature, provenance, chart
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write      # push the image and the chart to ghcr.io
      id-token: write      # keyless signing and attestations
      attestations: write  # store build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - id: v
        name: Version and tags
        run: |
          version="${GITHUB_REF_NAME#v}"
          tags="$IMAGE:$version"
          # Pre-releases (1.2.3-rc1) do not move :latest.
          case "$version" in *-*) ;; *) tags="$tags"$'\n'"$IMAGE:latest" ;; esac
          {
            echo "version=$version"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max   # buildkit provenance attestation per platform
          sbom: true             # buildkit SBOM attestation per platform
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            REVISION=${{ github.sha }}
          tags: ${{ steps.v.outputs.tags }}
      - name: Sign the image (cosign keyless, by digest)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Verify the signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "https://github.com/zyvorai/zyvor-setura-gateway/.github/workflows/image.yml@refs/tags/$GITHUB_REF_NAME" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
      - name: SLSA build provenance for the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Publish the Helm chart (OCI)
        env:
          VERSION: ${{ steps.v.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm package packaging/helm/setura --version "$VERSION" --app-version "$VERSION" --destination chart
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "chart/setura-$VERSION.tgz" "$CHARTS"
