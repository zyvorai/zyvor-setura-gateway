# An ingress-nginx Ingress for a small shop, as it runs today.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: demo
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-body-size: 8m
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
spec:
  ingressClassName: nginx
  tls:
    - hosts: [shop.example.test]
      secretName: shop-tls
  rules:
    - host: shop.example.test
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /cart
            pathType: Exact
            backend:
              service:
                name: cart
                port:
                  number: 8080
          - path: /legacy
            pathType: Prefix
            backend:
              service:
                name: legacy
                port:
                  number: 80
          # A named port: resolved against the Service in services.yaml.
          - path: /web
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
---
# gRPC backend: converts to a GRPCRoute.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rpc
  namespace: demo
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
spec:
  ingressClassName: nginx
  rules:
    - host: rpc.example.test
      http:
        paths:
          - path: /helloworld.Greeter
            pathType: Prefix
            backend:
              service:
                name: greeter
                port:
                  number: 50051
---
# A different class: skipped with --ingress-class nginx.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin
  namespace: demo
spec:
  ingressClassName: internal
  rules:
    - host: admin.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin
                port:
                  number: 80
