# What ingress2gateway produced, with one deliberate drift: /cart now points at
# the wrong port and /legacy was lost. /status is new and has no Ingress rule.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nginx
  namespace: demo
spec:
  gatewayClassName: envoy
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: shop.example.test
      tls:
        certificateRefs:
          - name: shop-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop-shop-example-test
  namespace: demo
spec:
  parentRefs:
    - name: nginx
  hostnames:
    - shop.example.test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: api
          port: 8080
    - matches:
        - path:
            type: Exact
            value: /cart
      backendRefs:
        - name: cart
          port: 9090
    - matches:
        - path:
            type: PathPrefix
            value: /web
      backendRefs:
        - name: web
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /status
      backendRefs:
        - name: status
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: rpc-rpc-example-test
  namespace: demo
spec:
  parentRefs:
    - name: nginx
  hostnames:
    - rpc.example.test
  rules:
    - matches:
        - method:
            service: helloworld.Greeter
      backendRefs:
        - name: greeter
          port: 50051
