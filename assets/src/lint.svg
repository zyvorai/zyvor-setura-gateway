<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1400 520" width="1400" height="520" role="img" aria-label="setura lint reports static Gateway API findings with stable rule IDs, with no cluster needed.">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1c1e"/><stop offset="1" stop-color="#121214"/></linearGradient>
  </defs>
  <rect width="1400" height="520" rx="28" fill="#000"/>
  <rect x="1" y="1" width="1398" height="518" rx="27" fill="none" stroke="#2c2c2e" stroke-width="2"/>
  <g transform="translate(50 50)">
    <rect width="1300" height="420" rx="22" fill="url(#card)" stroke="#3a3a3c"/>
    <circle cx="34" cy="32" r="8" fill="#ff5f57"/><circle cx="62" cy="32" r="8" fill="#febc2e"/><circle cx="90" cy="32" r="8" fill="#28c840"/>
    <g font-family="Menlo, Monaco, monospace" font-size="19">
      <text x="34" y="96" fill="#86868b">$ <tspan fill="#f5f5f7">setura lint --snapshot snapshot.json</tspan></text>
      <text x="34" y="156" fill="#ffd60a">WARNING</text><text x="130" y="156" fill="#f5f5f7">SET006  HTTPRoute/app/api  <tspan fill="#a1a1a6">hostnames [a.test] do not intersect the listener hostname on Gateway gw</tspan></text>
      <text x="34" y="196" fill="#ff453a">ERROR  </text><text x="130" y="196" fill="#f5f5f7">SET002  HTTPRoute/app/shop  <tspan fill="#a1a1a6">rule 1: all backendRefs have weight 0</tspan></text>
      <text x="34" y="236" fill="#ffd60a">WARNING</text><text x="130" y="236" fill="#f5f5f7">SET004  HTTPRoute/app/shop  <tspan fill="#a1a1a6">rule 2: backendRef db/pg needs a ReferenceGrant in namespace db</tspan></text>
      <text x="34" y="276" fill="#ff453a">ERROR  </text><text x="130" y="276" fill="#f5f5f7">SET005  HTTPRoute/app/shop  <tspan fill="#a1a1a6">parentRef gw names listener "tls", which Gateway gw does not declare</tspan></text>
      <text x="34" y="340" fill="#f5f5f7">2 error(s), 2 warning(s)</text>
      <text x="34" y="376" fill="#86868b">exit 1 · reads a saved snapshot · no cluster needed</text>
    </g>
  </g>
</svg>
