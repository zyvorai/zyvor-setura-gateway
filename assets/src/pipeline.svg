<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1600 420" width="1600" height="420" role="img" aria-label="Setura checks each hop of the request path: DNS, TCP, TLS, HTTP, backend identity, then response assertions.">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2997ff"/><stop offset="1" stop-color="#bf5af2"/></linearGradient>
  </defs>
  <rect width="1600" height="420" rx="28" fill="#000"/>
  <rect x="1" y="1" width="1598" height="418" rx="27" fill="none" stroke="#2c2c2e" stroke-width="2"/>
  <text x="800" y="80" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#f5f5f7" letter-spacing="-1">Every hop. One verdict.</text>
  <text x="800" y="122" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" fill="#86868b">Setura walks the real client path and stops at the first stage that breaks.</text>
  <rect x="160" y="218" width="1280" height="4" rx="2" fill="url(#line)" opacity="0.8"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(160 220)"><circle r="38" fill="#0b0b0d" stroke="#2997ff" stroke-width="3"/><text y="9" font-size="26" font-weight="700" fill="#2997ff">1</text><text y="88" font-size="28" font-weight="600" fill="#f5f5f7">DNS</text><text y="122" font-size="20" fill="#86868b">resolve or override</text></g>
    <g transform="translate(480 220)"><circle r="38" fill="#0b0b0d" stroke="#5e9bff" stroke-width="3"/><text y="9" font-size="26" font-weight="700" fill="#5e9bff">2</text><text y="88" font-size="28" font-weight="600" fill="#f5f5f7">TCP</text><text y="122" font-size="20" fill="#86868b">connect to the listener</text></g>
    <g transform="translate(800 220)"><circle r="38" fill="#0b0b0d" stroke="#7d7aff" stroke-width="3"/><text y="9" font-size="26" font-weight="700" fill="#7d7aff">3</text><text y="88" font-size="28" font-weight="600" fill="#f5f5f7">TLS</text><text y="122" font-size="20" fill="#86868b">trust and hostname</text></g>
    <g transform="translate(1120 220)"><circle r="38" fill="#0b0b0d" stroke="#a46bf2" stroke-width="3"/><text y="9" font-size="26" font-weight="700" fill="#a46bf2">4</text><text y="88" font-size="28" font-weight="600" fill="#f5f5f7">HTTP</text><text y="122" font-size="20" fill="#86868b">status, headers, body</text></g>
    <g transform="translate(1440 220)"><circle r="38" fill="#0b0b0d" stroke="#bf5af2" stroke-width="3"/><text y="9" font-size="26" font-weight="700" fill="#bf5af2">5</text><text y="88" font-size="28" font-weight="600" fill="#f5f5f7">Backend</text><text y="122" font-size="20" fill="#86868b">who really answered</text></g>
  </g>
</svg>
