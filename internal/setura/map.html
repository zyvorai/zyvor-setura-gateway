<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setura · Route map</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#142637;font:16px system-ui,sans-serif}main{max-width:1560px;margin:auto;padding:clamp(18px,4vw,54px)}h1{font-size:clamp(32px,4vw,54px);letter-spacing:-.055em;margin:0}header,nav{display:flex;gap:16px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}nav{margin:24px 0 12px}label{font-weight:600}select,button{font:inherit;border:1px solid #aebbc8;background:white;color:#17344c;border-radius:8px;padding:7px}select{max-width:100%}.canvas{background:white;border:1px solid #d2dbe3;border-radius:14px;overflow:auto;max-height:65vh}svg{display:block}.node{cursor:pointer}.node:focus rect,.node:hover rect{stroke:#005ac6;stroke-width:3}.dim{opacity:.16}pre{overflow:auto;background:white;padding:16px;border-radius:10px;font:14px ui-monospace,monospace}aside{color:#465d70}small{font-size:15px}path{fill:none;stroke:#91a4b5;stroke-width:1.6}.node text{pointer-events:none}
</style><main><header><h1>Route map</h1><strong>Setura / NAMESPACE_LABEL</strong></header>
<nav><label for="focus">Trace a resource</label><select id="focus"><option value="">All resources</option></select><button id="reset">Reset</button></nav>
<p id="summary"></p><div class="canvas"><svg id="graph" role="group" aria-label="Declared gateway topology"></svg></div>
<aside><p>Lines show declared references. Dashed backend links have zero weight. Select a resource to inspect its configuration and connected paths.</p></aside><pre id="detail" hidden></pre></main>
<script type="application/json" id="data">GRAPH_PAYLOAD</script><script>
const data=JSON.parse(document.querySelector('#data').textContent);
const svg=document.querySelector('#graph'), select=document.querySelector('#focus'), detail=document.querySelector('#detail');
const layers=[['Gateway','Parent'],['Listener'],['HTTPRoute'],['Rule'],['Service','Backend']];
const titles=['Parents','Listeners','HTTP routes','Rules','Backends'];
const pos=new Map(), groups=new Map(), lines=[], nodes=new Map(data.nodes.map(n=>[n.id,n]));
function draw(tag,attrs,parent=svg){const el=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);parent.append(el);return el}
function words(parent,x,y,value,attrs={}){const el=draw('text',{x,y,...attrs},parent);el.textContent=value;return el}
let maxRows=1;
layers.forEach((kinds,col)=>{const items=data.nodes.filter(n=>kinds.includes(n.kind)).sort((a,b)=>a.id.localeCompare(b.id));
 maxRows=Math.max(maxRows,items.length);words(svg,20+col*236,30,titles[col],{'font-size':14,fill:'#526579'});
 items.forEach((n,row)=>pos.set(n.id,[20+col*236,55+row*86]));});
svg.setAttribute('width',1190);svg.setAttribute('height',65+86*maxRows);
for(const e of data.edges){const [x,y]=pos.get(e.from),[u,v]=pos.get(e.to);
 const path=draw('path',{d:`M ${x+194} ${y+27} C ${x+217} ${y+27}, ${u-23} ${v+27}, ${u} ${v+27}`});
 if(e.weight===0)path.setAttribute('stroke-dasharray','4 3');lines.push([e,path]);}
for(const [id,[x,y]] of pos){const n=nodes.get(id),g=draw('g',{class:'node',tabindex:0,role:'button','aria-label':id});groups.set(id,g);
 draw('rect',{x,y,width:194,height:55,rx:9,fill:n.kind==='HTTPRoute'?'#e6f2ff':'#f9fbfc',stroke:'#b7c6d3'},g);
 words(g,x+10,y+23,n.name.length>21?n.name.slice(0,20)+'…':n.name,{'font-size':15,'font-weight':600});
 words(g,x+10,y+44,n.namespace,{'font-size':12,fill:'#526579'});g.onclick=()=>focusNode(id);
 g.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();focusNode(id)}};select.add(new Option(id,id));}
function walk(id,forward){const visited=new Set([id]),stack=[id];while(stack.length){const key=stack.pop();
 for(const e of data.edges){const [from,to]=forward?[e.from,e.to]:[e.to,e.from];
 if(from===key&&!visited.has(to)){visited.add(to);stack.push(to)}}}return visited}
function focusNode(id){select.value=id;const visible=id?new Set([...walk(id,true),...walk(id,false)]):new Set(pos.keys());
 for(const [key,g] of groups)g.classList.toggle('dim',!visible.has(key));for(const [e,p] of lines)p.classList.toggle('dim',!visible.has(e.from)||!visible.has(e.to));
 detail.hidden=!id;detail.textContent=id?JSON.stringify({resource:nodes.get(id),connections:data.edges.filter(e=>e.from===id||e.to===id)},null,2):'';}
select.onchange=()=>focusNode(select.value);document.querySelector('#reset').onclick=()=>focusNode('');
document.querySelector('#summary').textContent=data.nodes.length+' resources and rule entries · '+data.edges.length+' relationships';
</script></html>
