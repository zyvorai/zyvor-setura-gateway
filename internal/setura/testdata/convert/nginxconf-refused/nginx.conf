http {
    limit_req_zone $binary_remote_addr zone=one:10m rate=1r/s;
    server {
        listen 8080;
        server_name a.example.test ~^(?<sub>.+)\.example\.test$;
        location / {
            if ($request_method = POST) { return 405; }
            proxy_pass http://10.0.0.5:80;
        }
        location /static/ {
            root /var/www;
            try_files $uri =404;
        }
        location ~* \.png$ {
            proxy_pass http://img;
        }
        location /x {
            rewrite ^/x/(.*)$ /$1 break;
            proxy_pass http://web;
        }
    }
}
