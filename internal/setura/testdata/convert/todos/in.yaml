apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: t
  namespace: demo
  annotations:
    nginx.ingress.kubernetes.io/configuration-snippet: "more_set_headers "X: y";"
    nginx.ingress.kubernetes.io/server-snippet: "return 418;"
    nginx.ingress.kubernetes.io/limit-rps: "5"
    nginx.ingress.kubernetes.io/limit-rpm: "100"
    nginx.ingress.kubernetes.io/limit-connections: "10"
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/auth-tls-secret: "demo/ca"
    nginx.ingress.kubernetes.io/load-balance: "ewma"
    nginx.ingress.kubernetes.io/totally-unknown: "yes"
    nginx.ingress.kubernetes.io/service-upstream: "true"
    nginx.ingress.kubernetes.io/server-alias: "www.t.example.test, t2.example.test"
    kubernetes.io/ingress.class: "nginx"
spec:
  tls:
  - hosts: [t.example.test]
  rules:
  - host: t.example.test
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 80
      - path: /named
        pathType: Prefix
        backend:
          service:
            name: nosuch
            port:
              name: web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: res, namespace: demo}
spec:
  rules:
  - host: res.example.test
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          resource: {apiGroup: storage.example.test, kind: Bucket, name: assets}
