apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mine
  namespace: demo
spec:
  ingressClassName: nginx
  rules:
  - host: mine.example.test
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: a
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: theirs
  namespace: demo
spec:
  ingressClassName: other
  rules:
  - host: theirs.example.test
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: b
            port:
              number: 80
