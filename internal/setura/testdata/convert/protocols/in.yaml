apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grpc
  namespace: demo
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
spec:
  rules:
  - host: g.example.test
    http:
      paths:
      - path: /helloworld.Greeter/SayHello
        pathType: Exact
        backend:
          service:
            name: greeter
            port:
              number: 50051
      - path: /
        pathType: Prefix
        backend:
          service:
            name: greeter
            port:
              number: 50051
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grpcs
  namespace: demo
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "GRPCS"
    nginx.ingress.kubernetes.io/proxy-ssl-name: "greeter.internal"
spec:
  rules:
  - host: gs.example.test
    http:
      paths:
      - path: /pkg.Svc
        pathType: Prefix
        backend:
          service:
            name: secure
            port:
              number: 50052
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: https
  namespace: demo
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "on"
spec:
  rules:
  - host: h.example.test
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: secure
            port:
              number: 8443
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pass
  namespace: demo
  annotations:
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
    nginx.ingress.kubernetes.io/rewrite-target: "/x"
spec:
  rules:
  - host: p.example.test
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: tlsapp
            port:
              number: 443
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rx
  namespace: demo
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  rules:
  - host: rx.example.test
    http:
      paths:
      - path: /api/v[0-9]+/.*
        pathType: ImplementationSpecific
        backend:
          service:
            name: api
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: badgrpc
  namespace: demo
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
spec:
  rules:
  - host: bg.example.test
    http:
      paths:
      - path: /not/a/grpc/path
        pathType: Prefix
        backend:
          service:
            name: greeter
            port:
              number: 50051
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fcgi
  namespace: demo
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "FCGI"
spec:
  rules:
  - host: f.example.test
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: php
            port:
              number: 9000
