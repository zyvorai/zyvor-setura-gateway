# a simple front proxy
worker_processes auto;
events { worker_connections 1024; }
http {
    access_log /var/log/nginx/access.log;
    upstream api_pool {
        server api-a:8080 weight=3;
        server api-b.prod.svc.cluster.local:8080;
    }
    server {
        listen 80;
        server_name shop.example.test;
        location / {
            proxy_pass http://web:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Env prod;
            add_header X-Frame-Options DENY;
        }
        location /api/ {
            proxy_pass http://api_pool/v2/;
            proxy_read_timeout 90s;
            proxy_send_timeout 30s;
            allow 10.0.0.0/8;
            deny all;
        }
        location = /health {
            proxy_pass http://web:8080;
        }
        location ~ ^/v[0-9]+/items {
            proxy_pass http://items:80;
        }
        location /old {
            return 301 https://shop.example.test/new;
        }
    }
    server {
        listen 443 ssl;
        server_name secure.example.test;
        ssl_certificate /etc/ssl/secure.crt;
        ssl_certificate_key /etc/ssl/secure.key;
        client_max_body_size 10m;
        location / {
            proxy_pass https://backend:8443;
        }
    }
}
