apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: a
  namespace: demo
spec:
  rules:
  - host: b.c
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: one
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: a-b
  namespace: demo
spec:
  rules:
  - host: c
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: two
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: a
  namespace: other
spec:
  ingressClassName: internal
  rules:
  - host: b.c
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: three
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wild
  namespace: demo
spec:
  rules:
  - host: *.wild.example.test
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: w
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nohost
  namespace: demo
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dflt
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: defaultonly, namespace: demo}
spec:
  defaultBackend:
    service: {name: fallback, port: {number: 80}}
