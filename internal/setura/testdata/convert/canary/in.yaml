apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main
  namespace: demo
spec:
  rules:
  - host: c.example.test
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: stable
            port:
              number: 80
      - path: /hdr
        pathType: Prefix
        backend:
          service:
            name: stable
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: canary-weight
  namespace: demo
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "20"
spec:
  rules:
  - host: c.example.test
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: beta
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: canary-hdr
  namespace: demo
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-by-header: "X-Canary"
    nginx.ingress.kubernetes.io/canary-by-header-value: "beta"
    nginx.ingress.kubernetes.io/canary-by-cookie: "beta_user"
spec:
  rules:
  - host: c.example.test
    http:
      paths:
      - path: /hdr
        pathType: Prefix
        backend:
          service:
            name: beta
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lonely
  namespace: demo
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "5"
spec:
  rules:
  - host: x.example.test
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: beta
            port:
              number: 80
