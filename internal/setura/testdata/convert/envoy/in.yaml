apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: eg, namespace: demo}
spec:
  gatewayClassName: eg
  listeners:
  - {name: http, protocol: HTTP, port: 80}
  - name: https
    protocol: HTTPS
    port: 443
    tls: {mode: Terminate, certificateRefs: [{name: edge-cert}]}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: orders, namespace: demo}
spec:
  parentRefs: [{name: eg}]
  hostnames: [orders.example.test]
  rules:
  - name: read
    matches: [{path: {type: PathPrefix, value: /orders}}]
    backendRefs: [{name: orders, port: 80}]
    filters:
    - type: ExtensionRef
      extensionRef: {group: gateway.envoyproxy.io, kind: HTTPRouteFilter, name: token}
  - name: admin
    matches: [{path: {type: PathPrefix, value: /admin}}]
    backendRefs: [{name: admin, port: 80}]
  - name: gone
    matches: [{path: {type: PathPrefix, value: /old}}]
    filters:
    - type: ExtensionRef
      extensionRef: {group: gateway.envoyproxy.io, kind: HTTPRouteFilter, name: gone}
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata: {name: rpc, namespace: demo}
spec:
  parentRefs: [{name: eg}]
  rules:
  - matches: [{method: {service: pkg.Svc}}]
    backendRefs: [{name: rpc, port: 9000}]
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata: {name: slow, namespace: demo}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: orders}]
  timeout:
    http: {requestTimeout: 30s, connectionIdleTimeout: 5m}
    tcp: {connectTimeout: 2s}
  retry:
    numRetries: 3
    retryOn: {httpStatusCodes: [502, 503], triggers: [connect-failure, reset]}
    perRetry: {timeout: 2s, backOff: {baseInterval: 100ms}}
  rateLimit:
    type: Local
    local:
      rules:
      - limit: {requests: 100, unit: Minute}
  circuitBreaker: {maxConnections: 10}
  loadBalancer: {type: LeastRequest, slowStart: {window: 30s}}
  compression: [{type: Gzip}, {type: Brotli}]
  requestBuffer: {limit: 10Mi}
  faultInjection:
    delay: {fixedDelay: 2s, percentage: 10}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata: {name: web, namespace: demo}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: orders}]
  cors:
    allowOrigins: ["https://app.example.test"]
    allowMethods: [GET, POST]
    allowHeaders: [X-Token]
    maxAge: 24h
    allowCredentials: true
  jwt:
    providers:
    - name: idp
      issuer: https://idp.example.test
      audiences: [orders-api]
      remoteJWKS: {uri: https://idp.example.test/jwks.json}
      claimToHeaders: [{header: X-User, claim: sub}]
    - name: other
      issuer: https://other.example.test
  extAuth:
    http:
      backendRefs: [{name: authz, port: 9000}]
      path: /verify
      headersToBackend: [X-User]
  apiKeyAuth: {credentialRefs: [{name: keys}]}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata: {name: admin-only, namespace: demo}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: orders, sectionName: admin}]
  authorization:
    defaultAction: Deny
    rules:
    - action: Allow
      principal:
        clientCIDRs: ["10.1.0.0/16"]
        jwt: {provider: idp, claims: [{name: role, valueType: String, values: [admin]}]}
      operation: {methods: [GET, POST]}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: login
  namespace: demo
  annotations:
    setura.zyvor.dev/compat-oidc-cookie-key: "secret:session-keys#key"
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: orders, sectionName: read}]
  oidc:
    provider: {issuer: https://idp.example.test}
    clientID: orders-web
    clientSecret: {name: oidc-client}
    redirectURL: https://orders.example.test/oauth2/callback
    scopes: [email]
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata: {name: client, namespace: demo}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: Gateway, name: eg}]
  tls:
    minVersion: "1.3"
    ciphers: [ECDHE-RSA-AES128-GCM-SHA256, ECDHE-ECDSA-AES256-GCM-SHA384]
    session: {resumption: {stateless: {}}}
    clientValidation:
      caCertificateRefs: [{kind: ConfigMap, name: clients-ca}]
      subjectAltNames: ["*.clients.example.test"]
  connection: {connectionLimit: {value: 500}}
  timeout:
    http: {idleTimeout: 60s}
  clientIPDetection: {xForwardedFor: {numTrustedHops: 1}}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata: {name: gone, namespace: demo}
spec:
  directResponse: {statusCode: 410, contentType: text/plain, body: {type: Inline, inline: gone}}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata: {name: token, namespace: demo}
spec:
  credentialInjection:
    header: Authorization
    credential: {valueRef: {name: upstream-token}}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata: {name: ghost, namespace: demo}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: nosuch}]
  cors: {allowOrigins: ["*"]}
