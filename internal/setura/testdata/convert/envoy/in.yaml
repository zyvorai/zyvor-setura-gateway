apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: eg, namespace: demo}
spec:
  gatewayClassName: eg
  listeners:
  - {name: http, protocol: HTTP, port: 80}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: orders, namespace: demo}
spec:
  parentRefs: [{name: eg}]
  hostnames: [orders.example.test]
  rules:
  - name: read
    matches: [{path: {type: PathPrefix, value: /orders}}]
    backendRefs: [{name: orders, port: 80}]
  - name: admin
    matches: [{path: {type: PathPrefix, value: /admin}}]
    backendRefs: [{name: admin, port: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata: {name: rpc, namespace: demo}
spec:
  parentRefs: [{name: eg}]
  rules:
  - matches: [{method: {service: pkg.Svc}}]
    backendRefs: [{name: rpc, port: 9000}]
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata: {name: slow, namespace: demo}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: orders}]
  timeout:
    http: {requestTimeout: 30s, connectionIdleTimeout: 5m}
    tcp: {connectTimeout: 2s}
  retry:
    numRetries: 3
    retryOn: {httpStatusCodes: [502, 503], triggers: [connect-failure, reset]}
    perRetry: {timeout: 2s, backOff: {baseInterval: 100ms}}
  rateLimit:
    type: Local
    local:
      rules:
      - limit: {requests: 100, unit: Minute}
  circuitBreaker: {maxConnections: 10}
  loadBalancer: {type: LeastRequest}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata: {name: web, namespace: demo}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: orders}]
  cors:
    allowOrigins: ["https://app.example.test"]
    allowMethods: [GET, POST]
    allowHeaders: [X-Token]
    maxAge: 24h
    allowCredentials: true
  jwt:
    providers:
    - name: idp
      issuer: https://idp.example.test
      audiences: [orders-api]
      remoteJWKS: {uri: https://idp.example.test/jwks.json}
      claimToHeaders: [{header: X-User, claim: sub}]
    - name: other
      issuer: https://other.example.test
  extAuth:
    http:
      backendRefs: [{name: authz, port: 9000}]
      path: /verify
      headersToBackend: [X-User]
  apiKeyAuth: {credentialRefs: [{name: keys}]}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata: {name: admin-only, namespace: demo}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: orders, sectionName: admin}]
  authorization:
    defaultAction: Deny
    rules:
    - action: Allow
      principal: {clientCIDRs: ["10.1.0.0/16"]}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata: {name: client, namespace: demo}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: Gateway, name: eg}]
  timeout:
    http: {idleTimeout: 60s}
  clientIPDetection: {xForwardedFor: {numTrustedHops: 1}}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata: {name: ghost, namespace: demo}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: nosuch}]
  cors: {allowOrigins: ["*"]}
