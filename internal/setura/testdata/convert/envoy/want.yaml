# TODO(setura) ClientTrafficPolicy demo/client clientIPDetection -- gateway wide, not per listener, and it names networks where Envoy counts hops (numTrustedHops)
# TODO(setura) ClientTrafficPolicy demo/client connection.connectionLimit: 500 -- has no field in a manifest: the controller (--envoy-compat) translates it to listener limits maxConnections (the port of the listener); offline use --max-connections, or a limits block on the listener of a snapshot file
# TODO(setura) ClientTrafficPolicy demo/client timeout.http.idleTimeout: 60s -- gateway wide, not per listener
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg
  namespace: demo
  annotations:
    setura.zyvor.dev/client-allow: "{\"san\":[\"*.clients.example.test\"]}"
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      port: 80
      protocol: HTTP
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - name: edge-cert
        mode: Terminate
        options:
          setura.zyvor.dev/tls-cipher-suites: TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
          setura.zyvor.dev/tls-min-version: "1.3"
          setura.zyvor.dev/tls-session-resumption: "on"
  tls:
    frontend:
      default:
        validation:
          caCertificateRefs:
            - kind: ConfigMap
              name: clients-ca
          mode: AllowValidOnly
---
# TODO(setura) BackendTrafficPolicy demo/slow circuitBreaker.maxConnections: 10 -- has no field in a manifest: the controller (--envoy-compat) translates it to backend circuitBreaker.maxConnections; offline set it in a config file or with the gateway flags (see docs/envoy-compat.md)
# TODO(setura) BackendTrafficPolicy demo/slow compression.brotli -- brotli is not in the Go standard library
# TODO(setura) BackendTrafficPolicy demo/slow retry.retryOn.triggers: reset -- the gateway retries connection failures and the listed status codes only; this trigger has no equivalent
# TODO(setura) BackendTrafficPolicy demo/slow timeout.http.connectionIdleTimeout: 5m -- Setura has no per-route connection idle timeout
# TODO(setura) BackendTrafficPolicy demo/slow timeout.tcp.connectTimeout: 2s -- the dial timeout of the proxy is fixed
# TODO(setura) SecurityPolicy demo/web apiKeyAuth -- the converter cannot read the Secret: store each key as a hash with `setura gateway hash --kind apikey` in an auth apiKey block (the controller with --envoy-compat does this from the Secret)
# TODO(setura) SecurityPolicy demo/web jwt.providers: other -- an auth block accepts one JWT issuer: tokens of provider other are refused
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orders
  namespace: demo
  annotations:
    setura.zyvor.dev/auth.rule-1: "{\"inject\":[{\"header\":\"Authorization\",\"secret\":{\"secret\":{\"key\":\"credential\",\"name\":\"upstream-token\",\"namespace\":\"demo\"}}}],\"jwt\":{\"audience\":[\"orders-api\"],\"claimHeaders\":{\"X-User\":\"sub\"},\"issuer\":\"https://idp.example.test\",\"jwksUri\":\"https://idp.example.test/jwks.json\"},\"oidc\":{\"clientId\":\"orders-web\",\"clientSecret\":{\"secret\":{\"key\":\"client-secret\",\"name\":\"oidc-client\",\"namespace\":\"demo\"}},\"cookieKeys\":[{\"secret\":{\"key\":\"key\",\"name\":\"session-keys\",\"namespace\":\"demo\"}}],\"disableRefresh\":true,\"issuer\":\"https://idp.example.test\",\"redirectUrl\":\"https://orders.example.test/oauth2/callback\",\"scopes\":[\"email\"]}}"
    setura.zyvor.dev/auth.rule-2: "{\"authorization\":{\"defaultAction\":\"deny\",\"rules\":[{\"action\":\"allow\",\"name\":\"rule-1\",\"operations\":[{\"methods\":[\"GET\",\"POST\"]}],\"principals\":[{\"cidrs\":[\"10.1.0.0/16\"],\"claims\":[{\"in\":[\"admin\"],\"name\":\"role\"}]}]}]},\"jwt\":{\"audience\":[\"orders-api\"],\"claimHeaders\":{\"X-User\":\"sub\"},\"issuer\":\"https://idp.example.test\",\"jwksUri\":\"https://idp.example.test/jwks.json\"}}"
    setura.zyvor.dev/auth.rule-3: "{\"jwt\":{\"audience\":[\"orders-api\"],\"claimHeaders\":{\"X-User\":\"sub\"},\"issuer\":\"https://idp.example.test\",\"jwksUri\":\"https://idp.example.test/jwks.json\"}}"
    setura.zyvor.dev/compress.rule-1: "{\"enabled\":true,\"encodings\":[\"gzip\"]}"
    setura.zyvor.dev/compress.rule-2: "{\"enabled\":true,\"encodings\":[\"gzip\"]}"
    setura.zyvor.dev/compress.rule-3: "{\"enabled\":true,\"encodings\":[\"gzip\"]}"
    setura.zyvor.dev/direct-response.rule-3: "{\"body\":\"gone\",\"headers\":{\"Content-Type\":\"text/plain\"},\"status\":410}"
    setura.zyvor.dev/fault.rule-1: "{\"latency\":{\"delay\":\"2s\",\"percent\":10},\"name\":\"envoy-slow\",\"percent\":100,\"ttl\":\"24h\"}"
    setura.zyvor.dev/fault.rule-2: "{\"latency\":{\"delay\":\"2s\",\"percent\":10},\"name\":\"envoy-slow\",\"percent\":100,\"ttl\":\"24h\"}"
    setura.zyvor.dev/fault.rule-3: "{\"latency\":{\"delay\":\"2s\",\"percent\":10},\"name\":\"envoy-slow\",\"percent\":100,\"ttl\":\"24h\"}"
    setura.zyvor.dev/limits.rule-1: "{\"maxRequestBody\":\"10485760\"}"
    setura.zyvor.dev/limits.rule-2: "{\"maxRequestBody\":\"10485760\"}"
    setura.zyvor.dev/limits.rule-3: "{\"maxRequestBody\":\"10485760\"}"
    setura.zyvor.dev/load-balancer.rule-1: "{\"algorithm\":\"leastRequest\",\"slowStart\":{\"window\":\"30s\"}}"
    setura.zyvor.dev/load-balancer.rule-2: "{\"algorithm\":\"leastRequest\",\"slowStart\":{\"window\":\"30s\"}}"
    setura.zyvor.dev/load-balancer.rule-3: "{\"algorithm\":\"leastRequest\",\"slowStart\":{\"window\":\"30s\"}}"
    setura.zyvor.dev/rate-limit.rule-1: "{\"key\":\"route\",\"rate\":\"100/m\"}"
    setura.zyvor.dev/rate-limit.rule-2: "{\"key\":\"route\",\"rate\":\"100/m\"}"
    setura.zyvor.dev/rate-limit.rule-3: "{\"key\":\"route\",\"rate\":\"100/m\"}"
spec:
  hostnames:
    - orders.example.test
  parentRefs:
    - name: eg
  rules:
    - name: read
      backendRefs:
        - name: orders
          port: 80
      filters:
        - cors:
            allowCredentials: true
            allowHeaders:
              - X-Token
            allowMethods:
              - GET
              - POST
            allowOrigins:
              - https://app.example.test
            maxAge: 86400
          type: CORS
        - externalAuth:
            backendRef:
              name: authz
              port: 9000
            http:
              allowedResponseHeaders:
                - X-User
              path: /verify
            protocol: HTTP
          type: ExternalAuth
      matches:
        - path:
            type: PathPrefix
            value: /orders
      retry:
        attempts: 3
        backoff: 100ms
        codes:
          - 502
          - 503
        perTryTimeout: 2s
      timeouts:
        request: 30s
    - name: admin
      backendRefs:
        - name: admin
          port: 80
      filters:
        - cors:
            allowCredentials: true
            allowHeaders:
              - X-Token
            allowMethods:
              - GET
              - POST
            allowOrigins:
              - https://app.example.test
            maxAge: 86400
          type: CORS
        - externalAuth:
            backendRef:
              name: authz
              port: 9000
            http:
              allowedResponseHeaders:
                - X-User
              path: /verify
            protocol: HTTP
          type: ExternalAuth
      matches:
        - path:
            type: PathPrefix
            value: /admin
      retry:
        attempts: 3
        backoff: 100ms
        codes:
          - 502
          - 503
        perTryTimeout: 2s
      timeouts:
        request: 30s
    - name: gone
      filters:
        - cors:
            allowCredentials: true
            allowHeaders:
              - X-Token
            allowMethods:
              - GET
              - POST
            allowOrigins:
              - https://app.example.test
            maxAge: 86400
          type: CORS
        - externalAuth:
            backendRef:
              name: authz
              port: 9000
            http:
              allowedResponseHeaders:
                - X-User
              path: /verify
            protocol: HTTP
          type: ExternalAuth
      matches:
        - path:
            type: PathPrefix
            value: /old
      retry:
        attempts: 3
        backoff: 100ms
        codes:
          - 502
          - 503
        perTryTimeout: 2s
      timeouts:
        request: 30s
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: rpc
  namespace: demo
spec:
  parentRefs:
    - name: eg
  rules:
    - backendRefs:
        - name: rpc
          port: 9000
      matches:
        - method:
            service: pkg.Svc
