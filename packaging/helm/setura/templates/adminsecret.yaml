{{- /* The admin endpoint needs a token off loopback. Keep an existing one across upgrades. */ -}}
{{- $existing := lookup "v1" "Secret" .Values.namespace "setura-gateway-admin" -}}
apiVersion: v1
kind: Secret
metadata:
  name: setura-gateway-admin
  namespace: {{ .Values.namespace }}
type: Opaque
{{- if and $existing $existing.data }}
data:
  token: {{ index $existing.data "token" }}
{{- else }}
stringData:
  token: {{ randAlphaNum 40 }}
{{- end }}
